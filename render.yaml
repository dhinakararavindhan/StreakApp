# Render blueprint (alternative to Fly.io). Lives at the repo root; the app is in ./chase.
# Add VAPID_PUBLIC / VAPID_PRIVATE in the dashboard.
services:
  - type: web
    name: chase-300
    runtime: docker
    rootDir: chase
    dockerfilePath: ./Dockerfile
    branch: claude/beautiful-bohr-znhivj   # change to main once merged
    plan: starter        # persistent disks need a paid plan
    healthCheckPath: /healthz
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DB_FILE
        value: /data/db.json
      - key: VAPID_SUBJECT
        value: mailto:you@example.com
      - key: VAPID_PUBLIC
        sync: false
      - key: VAPID_PRIVATE
        sync: false
