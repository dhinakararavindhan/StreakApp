# Fly.io config. Change `app` to a unique name, then:
#   fly launch --no-deploy --copy-config
#   fly volumes create chase_data --size 1
#   fly secrets set CONTACT_EMAIL=you@example.com VAPID_SUBJECT=mailto:you@example.com
#   fly deploy
app = "chase-300-change-me"
primary_region = "bom"

[build]

[env]
  PORT = "8080"
  DB_FILE = "/data/db.json"

[mounts]
  source = "chase_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
